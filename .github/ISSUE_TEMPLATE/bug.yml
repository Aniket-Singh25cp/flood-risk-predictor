name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the error text or a screenshot }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
