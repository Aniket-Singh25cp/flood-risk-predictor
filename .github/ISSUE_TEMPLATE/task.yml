name: Task
description: A unit of planned work (one branch, one PR)
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [ml, backend, frontend, data-qa-docs, devops]
    validations: { required: true }
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use GIVEN / WHEN / THEN lines where possible.
      placeholder: "GIVEN a valid district and rainfall WHEN POST /predict THEN probability and level are returned"
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Notes for the AI assistant (optional)
      description: Files to read first, constraints, links.
