name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r ml/requirements.txt ruff pytest
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the frontend exists yet
        id: has_fe
        run: |
          if [ -f frontend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has_fe.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, build
        if: steps.has_fe.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm run build

  secrets-check:
    name: No obvious secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for key-like strings
        run: |
          if git grep -nIE "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{30,})" -- . ':!*.lock' ':!package-lock.json'; then
            echo "Possible secret found. Remove it, rotate the key, and force the history clean."; exit 1
          fi
